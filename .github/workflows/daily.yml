name: Dashboard täglich aktualisieren

on:
  schedule:
    - cron: "30 5 * * 1-5"   # Mo–Fr 05:30 UTC = 06:30 Winterzeit / 07:30 Sommerzeit
  workflow_dispatch: {}       # manuell startbar über "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Push-Nachricht senden (ntfy)
        if: github.event_name == 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py || echo "Benachrichtigung fehlgeschlagen"
      - name: Tages-Scan archivieren (hält den Zeitplan aktiv)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git push
      - name: Seite vorbereiten
        run: mkdir -p site && cp dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
